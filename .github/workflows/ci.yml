name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    # A wedged evaluation must fail on its own rather than sit on a runner for GitHub's 6-hour
    # default. This job has historically finished in well under three minutes, so this is generous
    # headroom for a cold nixpkgs fetch and still bounds the damage.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # --all-systems is NOT optional here, and is the whole reason this file spells the command
      # out rather than running a bare `nix flake check`.
      #
      # Without it, `nix flake check` evaluates only the checks for the RUNNER's own system and
      # prints "omitted these incompatible systems" as a warning — then exits 0. Every other system
      # this flake declares goes unevaluated while CI reports green, which is a check that passed
      # having tested nothing.
      #
      # `systems` in flake.nix is deliberately narrow so this can be strict: only platforms that
      # can genuinely be evaluated are declared, and all of them really are.
      #
      # --keep-going runs the remaining checks after one of them fails, so a single broken
      # derivation reports itself instead of hiding every check queued behind it. The run still
      # exits non-zero — this widens what one red run tells you, it does not make anything green.
      - name: nix flake check (all systems)
        run: nix flake check --all-systems --keep-going --print-build-logs
